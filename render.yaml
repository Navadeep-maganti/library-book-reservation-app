services:
  - type: web
    name: library-app-backend
    env: python
    rootDir: backend/server
    buildCommand: ./build.sh
    startCommand: gunicorn server.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: library-app-backend.onrender.com
